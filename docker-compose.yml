services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chisinau-monopoly-server
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - chisinau-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chisinau-monopoly-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - chisinau-net

networks:
  chisinau-net:
    driver: bridge
